<body dir="rtl">
    <div class="conatinerPrompt container-fluid d-flex flex-column">

        <div class="prompt-container">
            <div class="prompt-header">
                <span>اضافة سند مدفوعات عميل</span>
            </div>

            <div class="prompt-body">
                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="trsNo">رقم السند</label>
                            <input type="number" id="trsNo" class="form-control" formControlName="trsNo">
                        </div>
                        <div class="col-md-3">
                            <label for="trsDt">تاريخ السند</label>
                            <div class="date-input-wrapper">
                                <input id="trsDt" class="form-control" placeholder="dd/mm/yyyy"
                                    [matDatepicker]="trsDtPicker" formControlName="trsDt">
                                <mat-datepicker-toggle [for]="trsDtPicker"></mat-datepicker-toggle>
                                <mat-datepicker #trsDtPicker></mat-datepicker>
                            </div>
                        </div>
                    </div>

                    <div class="custom-divider"></div>

                    <div class="row">
                        <div class="col-md-3">
                            <label for="cstId">كود العميل</label>
                            <input type="number" id="cstId" class="form-control" [value]="selectedCustomerId()"
                                placeholder="اختر العميل" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="cstName">اسم العميل</label>
                            <input type="text" id="cstName" class="form-control" [value]="selectedCustomerName()"
                                placeholder="اختر العميل" disabled>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="button" class="btn btn-primary w-100" (click)="openCustomerDialog()">اختر
                                العميل</button>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-3">
                            <label for="val">المبلغ</label>
                            <input type="number" id="val" class="form-control" formControlName="val">
                        </div>
                        <div class="col-md-6">
                            <label for="rem">البيان</label>
                            <input type="text" id="rem" class="form-control" formControlName="rem">
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">اضافة</button>
                        </div>
                        <div class="col-md-3">
                            <button type="button" class="btn btn-secondary w-100" (click)="cancel()">العودة</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
