<app-report-shell
  title="تقرير قائمة الأصناف"
  icon="fa-list-ul"
  submitLabel="بحث"
  [canSubmit]="!isFormInvalid()"
  [loading]="loading"
  [pdfUrl]="pdfUrl"
  [showExcel]="excelReportFlag === 1"
  (search)="search()"
  (excel)="downloadExcel()">

  <div class="rpt-field">
    <label for="firstItem">من صنف</label>
    <input
      id="firstItem"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="firstItem"
      [(ngModel)]="firstItem"
      #firstItemModel="ngModel"
      [class.rpt-invalid]="hasFirstItemError() && (firstItemModel.touched || firstItemModel.dirty)">
    @if (hasFirstItemError() && (firstItemModel.touched || firstItemModel.dirty)) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

  <div class="rpt-field">
    <label for="endItem">إلى صنف</label>
    <input
      id="endItem"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="endItem"
      [(ngModel)]="endItem"
      #endItemModel="ngModel"
      [class.rpt-invalid]="hasEndItemError() && (endItemModel.touched || endItemModel.dirty)">
    @if (hasEndItemError() && (endItemModel.touched || endItemModel.dirty)) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

</app-report-shell>
