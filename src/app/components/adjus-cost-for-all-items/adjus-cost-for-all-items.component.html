<div class="card shadow-sm position-relative" dir="rtl">

    <div class="card-ribbon w-100 text-center align-items-center justify-content-between  ">
      <div class="pageLabel " >

        <h2 class="mb-0 fw-bolder fs-3" style="color: white;">ضبط تكلفة جميع الاصناف </h2>
       <div class="iccc " >
       </div>
    </div>


    </div>
    <div class="card-body">

        <div class="card shadow-sm">
          <div class="card-body" >
              @if(this.emptyFlag==true){
                <div class="alert alert-dark fs-4" role="alert"  >
                  لا يوجد منتجات تحتاج الي الضبط
                 </div>
              }
              @else {
                <div class="d-flex justify-content-around align-items-center mb-3 pt-5">

                  <div class="d-flex flex-column justify-content-center align-items-center mb-3 w-100">
                      <div class="customer-filters w-100 text-center">
                          <!-- Progress Bar -->
                          <div class="progress" style="height: 60px;">
                            <div
                              class="progress-bar"
                              role="progressbar"
                              [style.width.%]="progress"
                              [attr.aria-valuenow]="completed"
                              [attr.aria-valuemin]="0"
                              [attr.aria-valuemax]="totlaCountItmesAdjust">
                              {{ completed }}/{{ totlaCountItmesAdjust }}
                            </div>
                          </div>

                          <button class="btn btn-primary mt-3" [disabled]="isRunning" (click)="startAdjustment()">
                            @if(isRunning){
                              جاري الضبط... ({{ completed }}/{{ totlaCountItmesAdjust }})
                            } @else {
                              ابدا ضبط التكلفة
                            }
                          </button>
                          </div>




                        </div>

                  </div>
              }
           
                   
                 
                

              </div>                   
          </div>
                    
        </div>
      



    </div>
