<p>app-report-items-card</p>
<body class="bg-light" dir="rtl">
   
  
  
  
        
    <div class="card shadow-sm position-relative">

      <div class="card-ribbon w-100 text-center align-items-center justify-content-between  ">
        <div class="pageLabel " >
          
          <h2 class="mb-0 fw-bolder" style="color: white;">تقرير بطاقة حركة صنف </h2>
         <div class="iccc " >              
         </div>                   
      </div>     
      
       
      </div>
      <div class="card-body">
       
          <div class="card shadow-sm">
            <div class="card-body" >
                <div class="d-flex justify-content-around align-items-center mb-3 pt-5">
                    
                    <div class="d-flex justify-content-center align-items-center mb-3">
                        <div class="customer-filters">
                            <!-- Search Row with Label -->
                            <div class="row g-3 mb-4 align-items-center">  <!-- Added align-items-center -->
                              <div class="col-auto">  <!-- Changed to col-auto for label -->
                                <h4 class="section-label m-0">بحث متقدم</h4>  <!-- Removed mb-3 -->
                              </div>
                             
                             
                              <div class="col">  <!-- Main content column -->
                                <div class="d-flex gap-3 w-100">
                                  <div class="search-box flex-fill">
                                    
                                    <app-item-picker
                                      [itemCode]="_Icustomfilter.specs.itmCd_search"
                                      [itemName]="selectedItemName"
                                      (itemSelected)="onItemPicked($event)">
                                    </app-item-picker>
                                    <small class="field-warning" *ngIf="hasItemCodeError() && itemCodeTouched">كود الصنف حقل إجباري</small>
                                  </div>

                              @if (multiStoreFlag=='True') {
                                <div class="search-box flex-fill select-filter">
                                  <label for="store_code">كود المخزن</label>
                                  <div class="select-wrapper">
                                    <i class="fas fa-warehouse"></i>
                                    <select
                                      id="store_code"
                                      class="custom-select"
                                      [(ngModel)]="_Icustomfilter.specs.strCd_search"
                                      #storeCodeModel="ngModel"
                                      [class.invalid-field]="hasStoreCodeError() && (storeCodeModel.touched || storeCodeModel.dirty)">
                                      <option value="" disabled selected>اختر المخزن</option>
                                      @for (store of storesList; track store.strCd) {
                                        <option [value]="store.strCd">{{store.strNm}}</option>
                                      }
                                    </select>
                                  </div>
                                  <small class="field-warning" *ngIf="hasStoreCodeError() && (storeCodeModel.touched || storeCodeModel.dirty)">كود المخزن حقل إجباري</small>
                                </div>
                              }
                                  @else{
                                    <div class="search-box flex-fill">
                                      <label for="customer_code">كود المخزن</label>
                                      <i class="fas fa-boxes"></i>
                                      <input disabled id="store_code_single" type="text" placeholder="البحث ..." [value]="singleStoreCode" [class.invalid-field]="hasSingleStoreCodeError()">
                                      <small class="field-warning" *ngIf="hasSingleStoreCodeError()">كود المخزن حقل إجباري</small>
                                    </div>
                                  }



                                  <div class="search-box flex-fill">
                                    <label for="startDate">تاريخ البداية</label>
                                    <div class="date-input-wrapper">
                                        <input
                                            id="startDate"
                                            [matDatepicker]="startPicker"
                                            placeholder="dd/mm/yyyy"
                                            [(ngModel)]="startDateObj"
                                            (ngModelChange)="onStartDateObjChange($event)"
                                            [class.invalid-field]="hasDateRequiredError() && !_Icustomfilter.specs.startDate?.trim() && startDateTouched">
                                        <mat-datepicker-toggle [for]="startPicker"></mat-datepicker-toggle>
                                        <mat-datepicker #startPicker></mat-datepicker>
                                    </div>
                                    <small class="field-warning" *ngIf="hasDateRequiredError() && !_Icustomfilter.specs.startDate?.trim() && startDateTouched">تاريخ البداية حقل إجباري</small>
                                </div>

                                <div class="search-box flex-fill">
                                    <label for="endDate">تاريخ النهاية</label>
                                    <div class="date-input-wrapper">
                                        <input
                                            id="endDate"
                                            [matDatepicker]="endPicker"
                                            placeholder="dd/mm/yyyy"
                                            [(ngModel)]="endDateObj"
                                            (ngModelChange)="onEndDateObjChange($event)"
                                            [class.invalid-field]="((hasDateRequiredError() && !_Icustomfilter.specs.endDate?.trim()) && endDateTouched) || (hasDateOrderError() && (startDateTouched || endDateTouched))">
                                        <mat-datepicker-toggle [for]="endPicker"></mat-datepicker-toggle>
                                        <mat-datepicker #endPicker></mat-datepicker>
                                    </div>
                                    <small class="field-warning" *ngIf="hasDateRequiredError() && !_Icustomfilter.specs.endDate?.trim() && endDateTouched">تاريخ النهاية حقل إجباري</small>
                                    <small class="field-warning" *ngIf="hasDateOrderError() && (startDateTouched || endDateTouched)">تاريخ البداية يجب أن يكون أقدم من تاريخ النهاية</small>
                                </div>
                                  

                                  <button
                                    class="btn btn-success px-4 py-0 "
                                    style="white-space: nowrap;"
                                    (click)="openPdfInline()"
                                    [disabled]="!_Icustomfilter.specs.startDate || !_Icustomfilter.specs.endDate || !_Icustomfilter.specs.itmCd_search?.trim() || (multiStoreFlag == 'True' && !_Icustomfilter.specs.strCd_search?.trim())">
                                    <i class="fas fa-search me-2"></i>بحث
                                  </button>
                                </div>
                              </div>
                            </div>
                    
                            <!-- Filters Row with Label 
                            <div class="row g-3 align-items-center"> 
                              <div class="col-auto">  
                                <h4 class="section-label m-0">تصفية النتائج</h4>   
                              </div>
                              <div class="col"> 
                                <div class="d-flex justify-content-start gap-3 flex-wrap">
                                  
                                   
                                  <div class="select-filter" style="width: 220px">
                                    <div class="select-wrapper">
                                      <i class="fas fa-sort"></i>
                                      <select class="custom-select" id="sortSelect" [(ngModel)]="_Icustomfilter.specs._Sort">
                                        <option value="" selected disabled>الترتيب</option>
                                        <option value="name_desc">تصاعديًا</option>
                                        <option value="name_asc">تنازليًا</option>
                                      </select>
                                    </div>
                                  </div>
                                  <button class="btn btn-outline-secondary px-4" style="white-space: nowrap;" (click)="clearFilter()">
                                    <i class="fas fa-times me-2"></i>مسح الفلتر
                                  </button>
                                </div>
                              </div>
                            </div>-->

                          
                          </div>
                        
                    </div>
                     
                     
                  

                </div>                   
            </div>
            @if(ExcelReportFlag == 1){
              <button class="btn btn-info" style="color: white;  background-color: #1e7fc1;"  (click)="downloadExcel()"><i class="fa fa-download" style="color: white; "  aria-hidden="true"></i> تحميل ملف اكسيل </button>                    
            }           
             
   
          </div>
        



      </div>
                                               
    
</div>

 
<iframe
*ngIf="pdfUrl"
[src]="pdfUrl"
width="100%"
height="800px">
</iframe>


</body>

<!-- Add this at the bottom of your template -->
