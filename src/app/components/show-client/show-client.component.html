





    <div class="main container-fluid mt-5">
    
        <div class="card-ribbon   text-center">
            <div class="pageLabel" >
              <h1 class="mb-0" > عرض بيانات عميل  </h1>
              <a  class="text-success small"> </a>
          </div>
          </div>
       
        <form [formGroup]="addForm"  >
            <div class="row mt-5">
                
                <!-- Account Details -->
                <div class="col-md-5 ms-5" dir="rtl">
    
    
                    <div class="card">
                        <div class="card-header">
                            <h3 class="form-section-title">تفاصيل الحساب</h3>
                        </div>
                        <div class="card-body">
                          
                            <div class="mb-3">
                                <label for="accountNum" class="form-label">رصيد البداية  </label>
                                <small class="p-2 " style="color: darkgreen;">رقم موجب أو سالب</small>
                                <input type="number" min="0" class="form-control" id="accountNum" formControlName="bBal">
                            </div>
                            <div class="mb-3">
                                <label for="balance" class="form-label">الرصيد</label>
                                <input type="number" min="0" class="form-control" id="balance" formControlName="bal">
                            </div>
                            <div class="mb-3">
                                <label for="taxNum" class="form-label"> البطاقة/ الرقم الضريبية</label>
                                <input type="text" class="form-control" id="taxNum" formControlName="taxId">
                            </div>
                            <div class="mb-3">
                                <label for="resp" class="form-label">اسم مسئول التواصل</label>
                                <input type="text" class="form-control" id="resp" formControlName="resp">
                            </div>
                            <div class="mb-3">
                                <label for="trst" class="form-label">حد الثقة</label>
                                <input type="text" class="form-control" id="trst" formControlName="trst">
                            </div>
                            <div class="mb-3">
                                <label for="comNum" class="form-label">السجل التجاري</label>
                                <input type="tel" class="form-control" id="comNum" formControlName="comId">
                            </div>
                            
                        </div>
                      </div>
    
                   
                    
                    
                    
                    
                </div>
            
                <!-- Client Details -->
                <div class="col-md-5 offset-md-1 " dir="rtl">
                    
    
                    <div class="card">
                        <div class="card-header">
                            <h3 class="form-section-title">تفاصيل العميل</h3>
                        </div>
                        <div class="card-body">

                            <div class="mb-3">
                                <label for="codeNumber" class="form-label">كود العميل/ المورد</label>
                                <input type="number"  class="form-control " id="codeNumber" disabled  placeholder="{{hereEditeCustomer.id}}">
                            </div>
                          
                            <div class="mb-3">
                                <label class="form-label">طبيعة الجهة </label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"  id="individual" value="1" formControlName="typ">
                                        <label class="form-check-label" for="individual">مورد </label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"  id="business" value="2" formControlName="typ">
                                        <label class="form-check-label" for="business">عميل </label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"  id="both" value="3" formControlName="typ">
                                        <label class="form-check-label" for="both">كلاهما </label>
                                    </div>
                                </div>
                            </div>
                             <div class="mb-3">
                                <label class="form-label">الحالة</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"  id="active" value="1" formControlName="pst">
                                        <label class="form-check-label" for="active">ساري</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"  id="notActive" value="2" formControlName="pst">
                                        <label class="form-check-label" for="notActive"> موقوف </label>
                                    </div>
                                </div>
                            </div>
                           
                            
                            <div class="mb-3">
                                <label for="fullName" class="form-label">الاسم بالكامل</label>
                                <input type="text" class="form-control" id="fullName" formControlName="cstNm">
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="telephone" class="form-label">هاتف</label>
                                    <input type="tel" class="form-control" id="telephone" formControlName="phon">
                                </div>
                                
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">عنوان الشارع </label>
                                <input type="text" class="form-control" id="address" formControlName="addr">
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="government" class="form-label">محافظة</label>
                                    <input type="text" class="form-control" id="government" formControlName="gov">
                                </div>
                                <div class="col">
                                    <label for="mrkz" class="form-label">مركز</label>
                                    <input type="text" class="form-control" id="mrkz" formControlName="mrkz">
                                </div>
                                <div class="col">
                                    <label for="sec" class="form-label ">قطاع</label>
                                    <input type="text" class="form-control" id="sec" formControlName="sec">
                                </div>
                            </div>
                        </div>
                      </div>
                    
                   
                   
    
    
                </div>
    
    
    
    
    
                <div class="form-actions mt-4 d-flex justify-content-end" dir="rtl" >
                    <button type="submit" class="btn btn-success"  routerLink="/customers">
                        <i class="fa fa-backward">العودة</i> </button>
                    
                </div>
            </div>
        </form>
    </div>
