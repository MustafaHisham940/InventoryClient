@if (isRendered) {
  <div class="notification-overlay" (click)="onBackdropClick()">
    <div class="notification-card" [class.leaving]="isLeaving" (click)="onCardClick($event)">
      <div class="notification-icon-wrap" aria-hidden="true">
        <span class="bell-ring"></span>
        <svg viewBox="0 0 24 24" class="bell-icon">
          <path
            d="M12 3a4 4 0 0 0-4 4v1.1c0 .9-.3 1.8-.9 2.5L5.5 12a1 1 0 0 0 .7 1.7h11.6a1 1 0 0 0 .7-1.7l-1.6-1.4c-.6-.7-.9-1.6-.9-2.5V7a4 4 0 0 0-4-4Zm0 18a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 21Z"
          />
        </svg>
      </div>

      <div class="notification-content">
        <h3>{{ title }}</h3>
        <p>{{ message }}</p>
      </div>

      <button type="button" class="ok-btn" (click)="onOkClick()">
        {{ okText }}
      </button>
    </div>
  </div>
}
