<div class="prompt-body" dir="rtl">

    <app-customer-table-seprate
        (CustomerOutputID)="onCustomerReceived($event)">
    </app-customer-table-seprate>

    <div class="button-group">
        <button class="btn btn-back" (click)="cancel()"><i class="fas fa-arrow-right me-2"></i>العودة</button>
        <button class="btn btn-confirm" [disabled]="!selectedCustomer" (click)="confirm()"><i class="fas fa-check me-2"></i>اختيار</button>
    </div>

</div>
