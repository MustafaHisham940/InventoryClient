<app-report-shell
  title="كشف حساب الصندوق"
  icon="fa-cash-register"
  submitLabel="معاينة"
  [canSubmit]="!isFormInvalid()"
  [loading]="loading"
  [pdfUrl]="pdfUrl"
  [showExcel]="excelReportFlag === 1"
  (search)="search()"
  (excel)="downloadExcel()">

  <app-store-scope-field
    [(storeCode)]="storeCode"
    label="المخزن المطلوب"
    [allowAll]="true"
    allLabel="جميع المخازن">
  </app-store-scope-field>

  <div class="rpt-field">
    <label for="startDate">خلال الفترة من</label>
    <div class="rpt-date" [class.rpt-invalid]="hasStartDateError() || hasDateOrderError()">
      <input
        id="startDate"
        name="startDate"
        [matDatepicker]="startDatePicker"
        placeholder="dd/mm/yyyy"
        [(ngModel)]="startDateObj">
      <mat-datepicker-toggle [for]="startDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #startDatePicker></mat-datepicker>
    </div>
    @if (hasStartDateError()) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

  <div class="rpt-field">
    <label for="endDate">إلى</label>
    <div class="rpt-date" [class.rpt-invalid]="hasEndDateError() || hasDateOrderError()">
      <input
        id="endDate"
        name="endDate"
        [matDatepicker]="endDatePicker"
        placeholder="dd/mm/yyyy"
        [(ngModel)]="endDateObj">
      <mat-datepicker-toggle [for]="endDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #endDatePicker></mat-datepicker>
    </div>
    @if (hasEndDateError()) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
    @if (hasDateOrderError()) {
      <small class="rpt-error">تاريخ البداية يجب أن يكون أقدم من تاريخ النهاية</small>
    }
  </div>

</app-report-shell>
