
<h1>app-reports</h1>

<body class="bg-light" dir="rtl">
   
  
  
  
        
        <div class="card shadow-sm position-relative">
  
          <div class="card-ribbon w-100 text-center align-items-center justify-content-between  ">
            <div class="pageLabel " >
              
              <h2 class="mb-0 fw-bolder" style="color: white;">جميـــــع الاصناف</h2>
             <div class="iccc " >              
             </div>                   
          </div>     
          
           
          </div>
          <div class="card-body">
           
              <div class="card shadow-sm">
                <div class="card-body" >
                    <div class="d-flex justify-content-around align-items-center mb-3 pt-5">
                        
                        <div class="d-flex justify-content-center align-items-center mb-3">
                            <div class="customer-filters">
                                <!-- Search Row with Label -->
                                <div class="row g-3 mb-4 align-items-center">  <!-- Added align-items-center -->
                                  <div class="col-auto">  <!-- Changed to col-auto for label -->
                                    <h4 class="section-label m-0">بحث متقدم</h4>  <!-- Removed mb-3 -->
                                  </div>
                                 
                                 
                                  <div class="col">  <!-- Main content column -->
                                    <div class="d-flex gap-3 w-100">
                                      <div class="search-box flex-fill">
                                        <i class="fas fa-boxes"></i>
                                        <input
                                          type="text"
                                          placeholder="البحث بالرقم..."
                                          [(ngModel)]="_Icustomfilter._idName"
                                          #idNameModel="ngModel"
                                          [class.invalid-field]="hasMainSearchError() && (idNameModel.touched || idNameModel.dirty || itemNameModel.touched || itemNameModel.dirty || barCodeModel.touched || barCodeModel.dirty)">
                                      </div>
                                      <div class="search-box flex-fill">
                                        <i class="fas fa-box"></i>
                                        <input
                                          type="text"
                                          placeholder="البحث بالاسم..."
                                          [(ngModel)] = "_Icustomfilter._itmName"
                                          #itemNameModel="ngModel"
                                          [class.invalid-field]="hasMainSearchError() && (idNameModel.touched || idNameModel.dirty || itemNameModel.touched || itemNameModel.dirty || barCodeModel.touched || barCodeModel.dirty)">
                                      </div>
                                      <div class="search-box flex-fill">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input
                                          type="text"
                                          placeholder="BarCode....."
                                          [(ngModel)]="_Icustomfilter._barCode"
                                          #barCodeModel="ngModel"
                                          [class.invalid-field]="hasMainSearchError() && (idNameModel.touched || idNameModel.dirty || itemNameModel.touched || itemNameModel.dirty || barCodeModel.touched || barCodeModel.dirty)">
                                      </div>
                                      <small class="field-warning" *ngIf="hasMainSearchError() && (idNameModel.touched || idNameModel.dirty || itemNameModel.touched || itemNameModel.dirty || barCodeModel.touched || barCodeModel.dirty)">يجب إدخال قيمة في حقل واحد على الأقل</small>
                                      <button class="btn btn-success px-4" style="white-space: nowrap;" (click)="openPdfInline()">
                                        <i class="fas fa-search me-2"></i>بحث
                                      </button>
                                    </div>
                                  </div>
                                </div>
                        
                                <!-- Filters Row with Label -->
                                <div class="row g-3 align-items-center">  <!-- Added align-items-center -->
                                  <div class="col-auto">  <!-- Changed to col-auto for label -->
                                    <h4 class="section-label m-0">تصفية النتائج</h4>  <!-- Removed mb-3 -->
                                  </div>
                                  <div class="col">  <!-- Main content column -->
                                    <div class="d-flex justify-content-start gap-3 flex-wrap">  <!-- Changed to justify-content-start -->
                                      
                                      <div class="select-filter" style="width: 220px">
                                        <div class="select-wrapper">
                                          <i class="fa-solid fa-boxes-packing"></i>
                                          <select class="custom-select" id="typeSelect" [(ngModel)]="_Icustomfilter._ctgId"  >
                                            <option value="" selected disabled>نوع الصنف</option>
                                            <option value="1">ضنف نوع 1</option>
                                            <option value="2">ضنف نوع 2</option>
                                            
                                          </select>
                                        </div>
                                      </div>
                                      <div class="select-filter" style="width: 220px">
                                        <div class="select-wrapper">
                                          <i class="fas fa-sort"></i>
                                          <select class="custom-select" id="sortSelect" [(ngModel)]="_Icustomfilter._sort">
                                            <option value="" selected disabled>الترتيب</option>
                                            <option value="name_desc">تصاعديًا</option>
                                            <option value="name_asc">تنازليًا</option>
                                          </select>
                                        </div>
                                      </div>
                                      <button class="btn btn-outline-secondary px-4" style="white-space: nowrap;" (click)="clearFilter()">
                                        <i class="fas fa-times me-2"></i>مسح الفلتر
                                      </button>
                                    </div>
                                  </div>
                                </div>

                              
                              </div>
                            
                        </div>
                         
                         
                      

                    </div>                   
                </div>
                @if(ExcelReportFlag == 1){
                  <button class="btn btn-info" style="color: white;  background-color: #1e7fc1;"  (click)="downloadExcel()"><i class="fa fa-download" style="color: white; "  aria-hidden="true"></i> تحميل ملف اكسيل </button>                    
                }           
                 
       
              </div>
            
  
  
  
          </div>
                                                   
        
    </div>
  
     
    <iframe
    *ngIf="pdfUrl"
    [src]="pdfUrl"
    width="100%"
    height="800px">
  </iframe>
  
  
  </body>
  
  <!-- Add this at the bottom of your template -->
