<div class="d-flex gap-3 align-items-end flex-wrap" dir="rtl">

    <div class="flex-fill">
        <label class="form-label">البحث بكود الصنف</label>
        <input #codeInput type="text" class="form-control" [value]="itemCode"
               (input)="onItemCodeInput(codeInput.value)">
    </div>

    <div class="flex-fill">
        <label class="form-label">عرض اسم الصنف</label>
        <input type="text" class="form-control" [value]="itemName" disabled>
    </div>

    <button type="button" class="btn btn-primary" (click)="openItemDialog()">
        اختر الصنف
    </button>

</div>
