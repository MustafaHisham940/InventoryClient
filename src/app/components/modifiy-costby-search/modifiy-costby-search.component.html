<div class="container-fluid py-4">

    <div class="card shadow-sm position-relative">
  
  
      <!-- Ribbon Title -->
      <div class="card-ribbon w-100 text-center">
  
        <div class="pageLabel justify-content-center w-100">
  
          <h2 class="mb-0 fw-bolder" style="color:white;">
            ضبط التكلفة
          </h2>
  
        </div>
  
      </div>
  
  
  
      <!-- Card Content -->
      <div class="card-body">
  
  
        <div class="d-flex justify-content-center align-items-center pt-5">
  
  
          <div class="customer-filters w-75">
  
  
            <div class="row g-3 align-items-center">
  
  
              <!-- First Input -->
  
              <div class="col">
  
                <div class="search-box">
  
                  <i class="fas fa-barcode"></i>
  
                  <input 
                  [(ngModel)]="curItemCode"
                    type="text"
                    class="form-control"
                    placeholder="كود الصنف..."
                  >
                  @if(curItemCode==undefined || curStrCode==undefined){
                    <small style="color: red;">لا يمكن ان يكون العنصر فارغا</small>
                    }
  
                </div>
  
              </div>
  
  
  
              <!-- Second Input -->
  
              <div class="col">
  
                <div class="search-box">
  
                  <i class="fas fa-box"></i>
  
                  <input 
                  [(ngModel)]="curStrCode"
                    type="text"
                    class="form-control"
                    placeholder="كود المخزن ..."
                  >
  
                </div>
                @if(curItemCode==undefined || curStrCode==undefined){
                <small style="color: red;">لا يمكن ان يكون العنصر فارغا</small>
                }
              </div>
  
  
  
              <!-- Search Button -->
  
              <div class="col-auto">
                
                @if(curItemCode==undefined || curStrCode==undefined){
                  <button 
                  class="btn btn-success px-4"
                  style="white-space: nowrap;"
                >
  
                  <i class="fas fa-search me-2"></i>
  
                  بحث
  
                </button>
                }
               @else{
                <button 
                class="btn btn-success px-4"
                style="white-space: nowrap;"
                (click)="UpdateSpecificItem(curStrCode, curItemCode)"
              >

                <i class="fas fa-search me-2"></i>

                بحث

              </button>
               }
               
  
  
              </div>
  
  
            </div>
  
  
  
          </div>
  
  
        </div>
  
  
      </div>
  
  
    </div>
  
  
  </div>
