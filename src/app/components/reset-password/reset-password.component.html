<div class="container ">
    <div class="card-ribbon w-100 text-center">
        <div class="pageLabel" >
          <h4 class="mb-0" > اعادة تعيين كلمة المرور </h4>
          <a  class="text-success small"> </a>
      </div>
      </div>
   
    <form [formGroup]="addForm" (ngSubmit)="addClient()">
        <div class="row mt-5">
            
            <!-- Account Details -->
            <div class="col-md- ps-5" dir="rtl">


                <div class="card">
                    <div class="card-header">
                        <h5 class="form-section-title">تفاصيل الحساب</h5>
                    </div>
                    <div class="card-body">
                      
                        <div class="mb-3">
                            <label for="accountNum" class="form-label">User ID</label>
                            <input type="text" min="0" class="form-control" id="accountNum" formControlName="userId">
                        </div>
                        <div class="mb-3">
                            <label for="balance" class="form-label">New password</label>
                            <input type="text" min="0" class="form-control" id="balance" formControlName="newPassword">
                        </div>    
                        <div class="mb-3">
                            <label for="balance" class="form-label">confirm password</label>
                            <input type="text" min="0" class="form-control" id="balance" formControlName="ConfirmPAss">
                        </div>                 
                    </div>
                  </div>

               
                
                
                
                
            </div>

            <div class="form-actions mt-4 d-flex justify-content-end" dir="rtl" >
                <button type="submit" class="btn btn-success" > حفظ</button>
                <button type="button" class="btn btn-danger me-2">إلغاء</button>
            </div>
        </div>
    </form>
</div>
