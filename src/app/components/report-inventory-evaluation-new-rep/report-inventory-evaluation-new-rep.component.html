<app-report-shell
  title="تقرير تقييم المخزون"
  icon="fa-coins"
  submitLabel="بحث"
  [canSubmit]="!isFormInvalid()"
  [loading]="loading"
  [pdfUrl]="pdfUrl"
  [showExcel]="excelReportFlag === 1"
  (search)="search()"
  (excel)="downloadExcel()">

  <app-store-scope-field [(storeCode)]="storeCode"></app-store-scope-field>

  <div class="rpt-field">
    <label for="startItem">من صنف</label>
    <input
      id="startItem"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="startItem"
      [(ngModel)]="startItem"
      #startItemModel="ngModel"
      [class.rpt-invalid]="hasStartItemError() && (startItemModel.touched || startItemModel.dirty)">
    @if (hasStartItemError() && (startItemModel.touched || startItemModel.dirty)) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

  <div class="rpt-field">
    <label for="endItem">إلى صنف</label>
    <input
      id="endItem"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="endItem"
      [(ngModel)]="endItem"
      #endItemModel="ngModel"
      [class.rpt-invalid]="hasEndItemError() && (endItemModel.touched || endItemModel.dirty)">
    @if (hasEndItemError() && (endItemModel.touched || endItemModel.dirty)) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

</app-report-shell>
