<app-report-shell
  title="تقرير احتياج الأصناف للمخزن"
  icon="fa-cart-flatbed"
  submitLabel="بحث"
  [canSubmit]="!isFormInvalid()"
  [loading]="loading"
  [pdfUrl]="pdfUrl"
  [showExcel]="excelReportFlag === 1"
  (search)="search()"
  (excel)="downloadExcel()">

  <app-store-scope-field [(storeCode)]="storeCode"></app-store-scope-field>

  <div class="rpt-field">
    <label for="startItem">من صنف</label>
    <input
      id="startItem"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="startItem"
      [(ngModel)]="startItem"
      #startItemModel="ngModel"
      [class.rpt-invalid]="hasStartItemError() && (startItemModel.touched || startItemModel.dirty)">
    @if (hasStartItemError() && (startItemModel.touched || startItemModel.dirty)) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

  <div class="rpt-field">
    <label for="endtItem">إلى صنف</label>
    <input
      id="endtItem"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="endtItem"
      [(ngModel)]="endtItem"
      #endtItemModel="ngModel"
      [class.rpt-invalid]="hasEndtItemError() && (endtItemModel.touched || endtItemModel.dirty)">
    @if (hasEndtItemError() && (endtItemModel.touched || endtItemModel.dirty)) {
      <small class="rpt-error">يجب ادخال هذا العنصر</small>
    }
  </div>

</app-report-shell>
