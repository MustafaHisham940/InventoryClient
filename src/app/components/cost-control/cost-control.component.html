

<div class="card shadow-sm position-relative " dir="rtl">
  
    <!-- Ribbon Header -->
    <div class="card-ribbon w-100 text-center align-items-center justify-content-between">
      <div class="pageLabel">
        <h2 class="mb-0 fw-bolder" style="color: white;">جميـــــــــــع الاصنـــــــــاف التـــي تحتــــــــــــتاج ضبـــــط التكلفـــــة</h2>
        <div class="iccc"></div>
      </div>
     <button class="btn btn-lg" (click)="UpdateAllItemsNeedsCostControl()">
        <i class="fa-solid fa-gear"></i>
     </button>
    </div>
  
    <div class="card-body">
      <div class="card shadow-sm">
        <div class="card-body">
          <!-- Search and Filter Section -->
          <div class="d-flex justify-content-around align-items-center mb-3 pt-5">
            <div class="d-flex justify-content-center align-items-center mb-3">
              <div class="customer-filters">
                <!-- Search Row -->
             
              <div class="container-fluid pt-5">
                  <!-- Header Row -->
                  <div class="row g-3 mb-3 d-none d-md-flex">
                    <div class="col-md-2">
                      <strong>مسلسل</strong>
                    </div>
                    <div class="col-md-3">
                      <strong>اسم الصنف</strong>
                    </div>
                    <div class="col-md-3">
                      <strong>اسم المحزن</strong>
                    </div>
                    <div class="col-md-4">
                      <strong>الإجراءات</strong>
                    </div>
                  </div>
                
                  <!-- Data Rows -->
                  <div class="row g-3">
                    @for (item of _categories; track $index) {
                      <div class="col-12">
                        <div class="card border-0 shadow-sm mb-3">
                          <div class="card-body p-3">
                            
                            
                            <div class="row align-items-center">
                              <!-- Category ID Column -->
                              <div class="col-md-2 mb-2 mb-md-0">
                                <div class="d-md-none text-muted small">مسلسل</div>
                                <div class="fw-bold">{{$index+1}}</div>
                              </div>
                              
                              <!-- Category Name Column -->
                              <div class="col-md-3 mb-2 mb-md-0">
                                <div class="d-md-none text-muted small">اسم الصنف:</div>
                                <div>{{item.strcd}}</div>
                              </div>
                              
                              <!-- Category Name Column -->
                              <div class="col-md-3 mb-2 mb-md-0">
                                  <div class="d-md-none text-muted small">اسم المخزن:</div>
                                  <div>{{item.itmcd}}</div>
                                </div>
                              <!-- Actions Column (4th column with buttons) -->
                              <div class="col-md-4">
                                <div class="d-md-none text-muted small mb-2">ضيط التكلفة:</div>
                                <div class="btn-group" role="group">
                                  <button type="button" class="btn btn-sm btn-outline-primary" (click)="UpdateSpecificItem(item.strcd,item.itmcd)" title="عرض التفاصيل">
                                    <i class="fas fa-box-open"></i>
                                  </button>
                
                                < <button class="btn btn-sm btn-outline-primary" (click)="getCustomerById(item.id, item.ctgName)" title="تعديل">
                                    <i class="fas fa-edit"></i>
                                  </button>
                
                                  <button type="button" class="btn btn-sm btn-outline-danger" (click)="gotoDeleteComponent(item.id)" title="حذف">
                                    <i class="fas fa-trash"></i>
                                  </button>
                                </div>
                              </div>
                            </div>
                          
                          
                          </div>
                        </div>
                      </div>
                    }
                  </div>
                </div>
          <!-- Pagination -->
           
        </div>
      </div>
    </div>
  </div>
