<app-report-shell
  title="تقرير ضبط التكلفة"
  icon="fa-calculator"
  submitLabel="بحث"
  [canSubmit]="!isFormInvalid()"
  [loading]="loading"
  [pdfUrl]="pdfUrl"
  [showExcel]="ExcelReportFlag === 1"
  (search)="search()"
  (excel)="downloadExcel()">

  <div class="rpt-field">
    <label for="item_code">كود الصنف</label>
    <input
      id="item_code"
      type="text"
      class="rpt-input"
      placeholder="كود الصنف"
      name="itemCode"
      [(ngModel)]="itemCode"
      #itemCodeModel="ngModel"
      [class.rpt-invalid]="hasItemCodeError() && (itemCodeModel.touched || itemCodeModel.dirty)">
    @if (hasItemCodeError() && (itemCodeModel.touched || itemCodeModel.dirty)) {
      <small class="rpt-error">كود الصنف حقل إجباري</small>
    }
  </div>

  <app-store-scope-field [(storeCode)]="storeCode"></app-store-scope-field>

</app-report-shell>
