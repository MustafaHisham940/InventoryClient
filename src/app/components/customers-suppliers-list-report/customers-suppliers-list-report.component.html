<div class="card shadow-sm position-relative" dir="rtl">

  <div class="card-ribbon w-100 text-center align-items-center justify-content-between">
    <div class="pageLabel">
      <h2 class="mb-0 fw-bolder" style="color: white;">تقرير العملاء والموردين</h2>
    </div>
  </div>

  <div class="card-body">
    <div class="customer-filters">
      <div class="row g-3 mb-4 align-items-center">
        <div class="col-auto">
          <h4 class="section-label m-0">بحث متقدم</h4>
        </div>

        <div class="col">
          <div class="d-flex gap-3 w-100 flex-wrap align-items-start">

            <div class="search-box flex-fill">
              <label for="startCstmr">من كود عميل</label>
              <input
                id="startCstmr"
                type="number"
                placeholder="من كود عميل"
                name="startCstmr"
                [(ngModel)]="startCstmr"
                #startCstmrModel="ngModel"
                [class.invalid-field]="hasStartCstmrError() && (startCstmrModel.touched || startCstmrModel.dirty)">
              <small class="field-warning" *ngIf="hasStartCstmrError() && (startCstmrModel.touched || startCstmrModel.dirty)">يجب ادخال هذا العنصر</small>
            </div>

            <div class="search-box flex-fill">
              <label for="endCstmr">إلى كود عميل</label>
              <input
                id="endCstmr"
                type="number"
                placeholder="إلى كود عميل"
                name="endCstmr"
                [(ngModel)]="endCstmr"
                #endCstmrModel="ngModel"
                [class.invalid-field]="hasEndCstmrError() && (endCstmrModel.touched || endCstmrModel.dirty)">
              <small class="field-warning" *ngIf="hasEndCstmrError() && (endCstmrModel.touched || endCstmrModel.dirty)">يجب ادخال هذا العنصر</small>
            </div>

            <button
              class="btn btn-success px-4"
              style="white-space: nowrap;"
              (click)="search()"
              [disabled]="isFormInvalid()">
              <i class="fas fa-search me-2"></i>بحث
            </button>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body pt-0" *ngIf="excelReportFlag === 1">
    <button
      class="btn btn-info"
      style="color: white; background-color: #1e7fc1;"
      (click)="downloadExcel()">
      <i class="fa fa-download" style="color: white;" aria-hidden="true"></i> تحميل ملف اكسيل
    </button>
  </div>
</div>

<iframe
  *ngIf="pdfUrl"
  [src]="pdfUrl"
  width="100%"
  height="800px">
</iframe>
